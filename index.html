    <!-- Analytics loader (deferred to idle/after load to avoid blocking LCP) -->
    <script>
      (function(){
        // Minimal non-blocking loader for GTM and Meta Pixel
        function loadScript(src, attrs){
          var s = document.createElement('script');
          s.src = src;
          s.async = true;
          if (attrs) Object.keys(attrs).forEach(k => s.setAttribute(k, attrs[k]));
          document.head.appendChild(s);
          return s;
        }

        function initGTM(){
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({'gtm.start': new Date().getTime(), event:'gtm.js'});
          loadScript('https://www.googletagmanager.com/gtm.js?id=GTM-N8JKLMC5');
        }

        function initFB(){
          window.fbq = window.fbq || function(){ (window.fbq.q = window.fbq.q || []).push(arguments); };
          loadScript('https://connect.facebook.net/en_US/fbevents.js').onload = function(){
            try{ window.fbq('init','4094152494218113'); window.fbq('track','PageView'); }catch(e){}
          };
        }

        var runner = function(){
          if ('requestIdleCallback' in window) requestIdleCallback(function(){ initGTM(); initFB(); }, {timeout:2000});
          else window.addEventListener('load', function(){ setTimeout(function(){ initGTM(); initFB(); }, 1000); });
        };

        // Run after DOM ready
        if (document.readyState === 'complete' || document.readyState === 'interactive') runner(); else document.addEventListener('DOMContentLoaded', runner);
      })();
    </script>
