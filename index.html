    <!--
      Analytics are loaded after the browser becomes idle.
      This prevents GTM/Meta Pixel from competing with the initial page load.
    -->
    <script>
      (function () {
        function loadScript(src) {
          var script = document.createElement("script");
          script.src = src;
          script.async = true;
          document.head.appendChild(script);
          return script;
        }

        function initAnalytics() {
          /* Google Tag Manager */
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            "gtm.start": new Date().getTime(),
            event: "gtm.js"
          });

          loadScript(
            "https://www.googletagmanager.com/gtm.js?id=GTM-N8JKLMC5"
          );

          /* Meta Pixel */
          window.fbq =
            window.fbq ||
            function () {
              window.fbq.callMethod
                ? window.fbq.callMethod.apply(window.fbq, arguments)
                : window.fbq.queue.push(arguments);
            };

          window.fbq.queue = window.fbq.queue || [];
          window.fbq.loaded = true;
          window.fbq.version = "2.0";

          loadScript(
            "https://connect.facebook.net/en_US/fbevents.js"
          ).onload = function () {
            try {
              window.fbq("init", "4094152494218113");
              window.fbq("track", "PageView");
            } catch (e) {}
          };
        }

        function scheduleAnalytics() {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(initAnalytics, {
              timeout: 3000
            });
          } else {
            window.setTimeout(initAnalytics, 2000);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener(
            "DOMContentLoaded",
            scheduleAnalytics
          );
        } else {
          scheduleAnalytics();
        }
      })();
    </script>
